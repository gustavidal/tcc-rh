openapi: 3.0.3
info:
  title: Sistema Integrado de Inteligência Estratégica em Gestão de Pessoas para Apoio à Tomada de Decisão
  description: |-
    API destinada ao software de gestão de desempenho "ColaborE".

    Cobre usuários (administrativo e gestor), funcionários, departamentos, competências, metas organizacionais, avaliações, contatos (telefone e e-mail) e tabelas de domínio.

    Autenticação via JWT (header `Authorization: Bearer <token>`), obtido em `POST /v1/colaborar/auth/login`.
  termsOfService: http://swagger.io/terms/
  contact:
    email: gustavovidalgva@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: http://localhost:8080/
security:
- bearerAuth: []
tags:
- name: Autenticação
  description: Endpoint público para login no sistema
- name: Usuário
  description: Endpoints restritos para gerenciamento de usuários do sistema (tbl_usuario, tbl_usuario_login, tbl_foto_usuario, tbl_usuario_telefone)
- name: Administrativo
  description: Endpoints restritos para gerenciamento do perfil administrativo (tbl_administrativo)
- name: Gestor
  description: Endpoints restritos para gerenciamento do perfil de gestor (tbl_gestor)
- name: Funcionário
  description: Endpoints restritos para gerenciamento de funcionários e seus vínculos (função, departamento, telefone, e-mail, competência, meta, foto)
- name: Avaliação
  description: Endpoints restritos para gerenciamento das avaliações de funcionários (tbl_avaliacao)
- name: Competência
  description: Endpoints restritos para gerenciamento de competências (tbl_competencia)
- name: Meta Organizacional
  description: Endpoints restritos para gerenciamento de metas organizacionais (tbl_meta_organizacional)
- name: Departamento
  description: Endpoints restritos para gerenciamento de departamentos, telefones e e-mails (tbl_departamento)
- name: Domínio (Sexo)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_sexo
- name: Domínio (Cargo)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_cargo
- name: Domínio (Função)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_funcao
- name: Domínio (Tipo de Telefone)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_tipo_telefone
- name: Domínio (Tipo de E-mail)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_tipo_email
- name: Domínio (Tipo de Competência)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_tipo_competencia
- name: Domínio (Status de Competência)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_status_competencia
- name: Domínio (Status de Funcionário)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_status_funcionario
- name: Domínio (Status de Meta)
  description: Endpoints restritos para gerenciamento da tabela de domínio tbl_status_meta
paths:
  /v1/colaborar/auth/login:
    post:
      tags:
      - Autenticação
      summary: Realiza o login do usuário
      description: Endpoint para realizar o login do usuário. Retorna os dados do usuário e o token JWT
      security: []
      requestBody:
        description: JSON contendo as credenciais do usuário
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/colaborar/usuarios:
    post:
      tags:
      - Usuário
      summary: Adiciona um novo usuário
      description: Endpoint para enviar os dados do novo usuário a ser cadastrado
      security:
      - bearerAuth: []
      requestBody:
        description: JSON contendo os dados do novo usuário
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
      responses:
        '201':
          description: Success Created Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioGet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Usuário
      summary: Lista todos os usuários
      description: Endpoint para listar todos os usuários cadastrados
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioGet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/colaborar/usuarios/{id}:
