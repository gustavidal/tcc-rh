components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      description: Id do recurso
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdTelefone:
      name: id_telefone
      in: path
      description: Id do telefone
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdEmail:
      name: id_email
      in: path
      description: Id do e-mail
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdFuncao:
      name: id_funcao
      in: path
      description: Id da função
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdDepartamento:
      name: id_departamento
      in: path
      description: Id do departamento
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdCompetencia:
      name: id_competencia
      in: path
      description: Id da competência
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdMetaOrganizacional:
      name: id_meta_organizacional
      in: path
      description: Id da meta organizacional
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdFuncionario:
      name: id_funcionario
      in: path
      description: Id do funcionário
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Número da página
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Error Bad Request (id | dados)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Error Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Error Forbidden (perfil sem permissão)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Error Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflict:
      description: Error Conflict (registro duplicado ou em uso)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    UnsupportedMediaType:
      description: Error Content Type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    InternalServerError:
      description: Error Internal Server (Controller | Model)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Sexo:
      type: object
      required:
      - sigla
      - sexo
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        sigla:
          type: string
          maxLength: 3
          description: O número máximo de caracteres é de 3
          minLength: 1
          example: M
        sexo:
          type: string
          maxLength: 15
          description: O número máximo de caracteres é de 15
          minLength: 1
          example: Masculino
    Cargo:
      type: object
      required:
      - nome
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        nome:
          type: string
          maxLength: 65
          description: O número máximo de caracteres é de 65
          minLength: 1
          example: Analista de RH
    Funcao:
      type: object
      required:
      - nome
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        nome:
          type: string
          maxLength: 100
          description: O número máximo de caracteres é de 100
          minLength: 1
          example: Recrutamento e Seleção
    TipoTelefone:
      type: object
      required:
      - tipo
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        tipo:
          type: string
          maxLength: 15
          description: O número máximo de caracteres é de 15
          minLength: 1
          example: Celular
    TipoEmail:
      type: object
      required:
      - tipo
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        tipo:
          type: string
          maxLength: 20
          description: O número máximo de caracteres é de 20
          minLength: 1
          example: Corporativo
    TipoCompetencia:
      type: object
      required:
      - tipo
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        tipo:
          type: string
          maxLength: 40
          description: O número máximo de caracteres é de 40
          minLength: 1
          example: Técnica
    StatusCompetencia:
      type: object
      required:
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        status:
          type: string
          maxLength: 40
          description: O número máximo de caracteres é de 40
          minLength: 1
          example: Em desenvolvimento
    StatusFuncionario:
      type: object
      required:
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        status:
          type: string
          maxLength: 40
          description: O número máximo de caracteres é de 40
          minLength: 1
          example: Ativo
    StatusMeta:
      type: object
      required:
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        status:
          type: string
          maxLength: 40
          description: O número máximo de caracteres é de 40
          minLength: 1
          example: Em andamento
    Login:
      type: object
      required:
      - email_login
      - senha
      properties:
        email_login:
          type: string
          maxLength: 256
          description: O número máximo de caracteres é de 256
          format: email
          minLength: 6
          example: usuario@empresa.com
        senha:
          type: string
          maxLength: 100
          description: O número máximo de caracteres é de 100
          minLength: 8
          format: password
    Credenciais:
      type: object
      properties:
        email_login:
          type: string
          maxLength: 256
          description: O número máximo de caracteres é de 256
          format: email
          minLength: 6
        senha:
          type: string
          maxLength: 100
          description: O número máximo de caracteres é de 100
          minLength: 8
          format: password
          writeOnly: true
    Foto:
      type: object
      required:
      - foto
      properties:
        foto:
          type: string
          maxLength: 250
          description: O número máximo de caracteres é de 250
          format: uri
          pattern: ^https?://.+
          example: https://imagem.example.com/foto.jpg
    Telefone:
      type: object
      required:
      - numero
      - id_tipo_telefone
      properties:
        numero:
          type: string
          maxLength: 25
          description: O número máximo de caracteres é de 25
          minLength: 8
          example: +55 11 91234-5678
        id_tipo_telefone:
          type: integer
          format: int64
          minimum: 1
          description: Id de tbl_tipo_telefone
    Email:
      type: object
      required:
      - email
      - id_tipo_email
      properties:
        email:
          type: string
          maxLength: 256
          description: O número máximo de caracteres é de 256
          format: email
          minLength: 7
        id_tipo_email:
          type: integer
          format: int64
          minimum: 1
          description: Id de tbl_tipo_email
    Usuario:
      type: object
      required:
      - nome
      - data_nascimento
      - email_login
      - senha
      properties:
        nome:
